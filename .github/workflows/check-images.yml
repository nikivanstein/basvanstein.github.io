# Fails when an image that the site uses has no optimized versions yet (or they
# are out of date). Fix it by running `python3 scripts/optimize_images.py`
# locally and committing images/optimized and _data/image_variants.json.
name: Check optimized images

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow PyYAML
      - run: python3 scripts/optimize_images.py --check
