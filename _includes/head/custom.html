<!-- start custom head snippets -->
<!-- Google tag (gtag.js). The queue is set up right away so the page view is
     recorded, but the ~150 KB script itself loads after the page has finished
     loading, so it doesn't compete with the page's own resources. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-GNCC507H1K');
  window.addEventListener('load', function () {
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-GNCC507H1K';
    document.head.appendChild(s);
  });
</script>

{% if page.mathjax %}
<!-- MathJax is only loaded on pages that set `mathjax: true` in their front matter. -->
<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
{% endif %}
