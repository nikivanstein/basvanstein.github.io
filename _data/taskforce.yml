lead: "Generative AI inside EC, and EC for generating EC: a bidirectional view of LLM-driven evolutionary computation."
text: "The task force promotes research, development and teaching of methods that combine generative AI, large language models in particular, with evolutionary computation. We organise special sessions, competitions, tutorials and special issues at IEEE CIS venues, and work on shared problem formulations, evaluation protocols, reproducibility standards and open benchmarks."
